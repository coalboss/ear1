<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img"
     aria-labelledby="title desc">
  <title id="title">EAR-1 challenge logo</title>
  <desc id="desc">An open ear formed by microphone-array nodes connected with directional trajectory arrows, followed by the EAR-1 wordmark.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="6" markerHeight="6" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#07858d"/>
    </marker>
    <style>
      .trajectory {
        fill: none;
        stroke: #07858d;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow);
      }
      .array-node {
        fill: #202124;
      }
      .wordmark {
        fill: #202124;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 88px;
        font-weight: 700;
        letter-spacing: 0;
      }
    </style>
  </defs>

  <!-- Open outer helix: the lower-left contour is intentionally omitted. -->
  <path class="trajectory" d="M94.1 90 C95.4 75 98.7 64 103.2 56"/>
  <path class="trajectory" d="M111.7 47 C116.9 42 122.7 38 127.3 36"/>
  <path class="trajectory" d="M137 32 C141.6 29 146.1 28 150.7 28"/>
  <path class="trajectory" d="M161.7 31 C174.1 35 185.1 45 194.2 59"/>
  <path class="trajectory" d="M200.7 74 C207.2 91 208.5 108 205.9 126"/>
  <path class="trajectory" d="M202.7 143 C200.7 159 196.8 174 189 188"/>
  <path class="trajectory" d="M179.9 201 C173.4 210 166.9 214 160.4 216"/>

  <!-- Inner antihelix and concha. -->
  <path class="trajectory" d="M127.9 107 C131.2 94 138.3 84 148.1 79"/>
  <path class="trajectory" d="M159.1 81 C171.5 88 179.3 103 182.5 123"/>
  <path class="trajectory" d="M162.4 152 C156.5 149 151.3 151 147.4 156"/>

  <!-- Microphone-array nodes. -->
  <g class="array-node">
    <circle cx="92.8" cy="100" r="5"/>
    <circle cx="107.1" cy="51" r="5"/>
    <circle cx="131.8" cy="34" r="5"/>
    <circle cx="155.9" cy="29" r="5"/>
    <circle cx="197.5" cy="65" r="5"/>
    <circle cx="203.3" cy="134" r="5"/>
    <circle cx="184.5" cy="195" r="5"/>
    <circle cx="155.2" cy="216" r="5"/>
    <circle cx="125.3" cy="115" r="5"/>
    <circle cx="153.3" cy="78" r="5"/>
    <circle cx="183.8" cy="132" r="5"/>
    <circle cx="168.2" cy="151" r="5"/>
    <circle cx="144.2" cy="160" r="5"/>
  </g>

  <text class="wordmark" x="238" y="151">EAR-1</text>
</svg>
